app:
  security:
    jwt:
      secret: ${JWT_SECRET}
    users:
      - username: ${ADMIN_USERNAME}
        password: ${ADMIN_PASSWORD}
        roles: [ADMIN]
      - username: ${AGENT_USERNAME}
        password: ${AGENT_PASSWORD}
        roles: [AGENT]
      - username: ${CUSTOMER_USERNAME}
        password: ${CUSTOMER_PASSWORD}
        roles: [CUSTOMER]
      - username: ${MANAGER_USERNAME}
        password: ${MANAGER_PASSWORD}
        roles: [MANAGER]
  chat:
    storage:
      mode: file
      file: ${java.io.tmpdir}/customer-service-chat/chat-sessions.json
  websocket:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:8080

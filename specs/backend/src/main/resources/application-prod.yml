spring:
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DATABASE:customer_service_chatbot}

app:
  security:
    users:
      - username: ${ADMIN_USERNAME}
        password: ${ADMIN_PASSWORD}
        roles: [ADMIN]
      - username: ${AGENT_USERNAME}
        password: ${AGENT_PASSWORD}
        roles: [AGENT]
      - username: ${CUSTOMER_USERNAME}
        password: ${CUSTOMER_PASSWORD}
        roles: [CUSTOMER]
      - username: ${MANAGER_USERNAME}
        password: ${MANAGER_PASSWORD}
        roles: [MANAGER]
  chat:
    storage:
      mode: mongo
  websocket:
    allowed-origins:
      - ${APP_ALLOWED_ORIGIN:https://customer-service.example.com}
  security:
    jwt:
      secret: ${JWT_SECRET}

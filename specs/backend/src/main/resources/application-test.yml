spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      database: customer_service_chatbot_test

app:
  security:
    users:
      - username: admin
        password: admin
        roles: [ADMIN]
      - username: agent
        password: agent
        roles: [AGENT]
      - username: customer
        password: customer
        roles: [CUSTOMER]
      - username: manager
        password: manager
        roles: [MANAGER]
  chat:
    storage:
      mode: file
      file: ${java.io.tmpdir}/customer-service-chat-test/chat-sessions.json
  websocket:
    allowed-origins:
      - "*"
